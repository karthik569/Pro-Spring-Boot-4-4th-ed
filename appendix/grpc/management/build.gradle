plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.apress.prospringboot4'
version = '0.0.1-SNAPSHOT'
description = 'Management gRPC Client - Spring Boot 4 with Spring gRPC 1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring gRPC
    implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter:1.0.0'

    // Protobuf
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // Java/Jakarta Annotations for generated code
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.69.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
