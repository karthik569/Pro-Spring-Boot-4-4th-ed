spring:
  application:
    name: management-grpc-client

  # Enable Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # gRPC Client Configuration
  grpc:
    client:
      channels:
        customer-service:
          address: 'static://localhost:9090'
          negotiation-type: plaintext

# Actuator Configuration for Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    com.apress.prospringboot4.management: INFO
    org.springframework.grpc: DEBUG
