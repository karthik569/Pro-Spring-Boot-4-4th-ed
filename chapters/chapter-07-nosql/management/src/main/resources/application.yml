spring:
  application:
    name: management
  profiles:
    active: dev

app:
  init-data: true

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/management
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.data.redis: DEBUG
    org.springframework.data.neo4j: DEBUG
    com.apress.crm: DEBUG

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:management;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

app:
  init-data: false

logging:
  level:
    org.springframework.data: INFO
    com.apress.crm: DEBUG