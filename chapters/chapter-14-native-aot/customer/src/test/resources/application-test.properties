spring.application.name=customer

# CockroachDB - use local instance with defaultdb
spring.datasource.url=jdbc:postgresql://localhost:26257/defaultdb?sslmode=disable
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.CockroachDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public

# Disable ApplicationReadyEvent data initialization during tests
spring.main.allow-bean-definition-overriding=true

# Cache - using in-memory from TestCacheConfiguration
spring.cache.type=simple
