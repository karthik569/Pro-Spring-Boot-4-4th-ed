server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        # Using native profile for local filesystem-based configuration
        # In production, you would use a Git repository
        native:
          search-locations: classpath:/config-repo
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        instanceId: ${spring.application.name}:${random.value}
        healthCheckPath: /actuator/health
        healthCheckInterval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
