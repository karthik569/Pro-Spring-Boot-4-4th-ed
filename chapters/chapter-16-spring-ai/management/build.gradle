plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.10.1'
}

group = 'com.apress.crm'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2024.0.0")
	set('springAiVersion', "1.0.0-M5")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.testcontainers:testcontainers-bom:1.20.4"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web' // For blocking web (needed for vector store)

	// Spring AI dependencies
	implementation 'org.springframework.ai:spring-ai-core'
	implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'
	implementation 'org.springframework.ai:spring-ai-ollama-spring-boot-starter'
	implementation 'org.springframework.ai:spring-ai-pgvector-store-spring-boot-starter'
	runtimeOnly 'org.postgresql:postgresql' // JDBC driver for pgvector

	// CRaC (Coordinated Restore at Checkpoint) support
	// Note: CRaC requires a CRaC-enabled JDK (e.g., Azul Zulu with CRaC)
	// The library provides no-op stubs when not running on a CRaC-enabled JDK
	implementation 'org.crac:crac:1.4.0'

	// OpenTelemetry and Observability
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	runtimeOnly 'io.opentelemetry:opentelemetry-exporter-otlp'

	// Spring Cloud Dependencies
	implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-stream-rabbit'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

	implementation 'io.r2dbc:r2dbc-pool'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'io.micrometer:micrometer-observation-test'
	testImplementation 'org.testcontainers:cockroachdb'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.awaitility:awaitility:4.2.2'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootBuildImage') {
	imageName = "management:${project.version}"
	// Enable native image building via environment variable or system property
	if (System.getenv('BP_NATIVE_IMAGE') == 'true' || project.hasProperty('nativeImage')) {
		environment = [
			'BP_NATIVE_IMAGE': 'true'
		]
		builder = 'paketobuildpacks/builder-jammy-tiny:latest'
	}
}

// Configuration for GraalVM native image building
graalvmNative {
	binaries {
		main {
			imageName = 'management'
		}
	}
}